<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Update Task</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 40px; }
    </style>
</head>
<body>

    <h2>Update Task</h2>
    
    <form action="/update/{{ task.id }}" method="POST">
        <input type="text" name="task" value="{{ task.title }}" required>
        <button type="submit">Save Changes</button>
        <a href="/">Cancel</a>
    </form>

</body>
</html>
